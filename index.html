    function searchSeat() {
      let rawInput = document.getElementById("nameInput").value;
      const input = rawInput.trim().replace(/[  ]/g, "");
      const resultDiv = document.getElementById("result");
      
      if (!input) {
        resultDiv.style.display = "block";
        resultDiv.innerHTML = "名前を入力してください";
        resultDiv.style.backgroundColor = "#f2f2f2";
        resultDiv.style.color = "#333";
        return;

      const results = seatData.filter(data => data.name.includes(input));

      resultDiv.style.display = "block";
      if (results.length === 1) {
        resultDiv.innerHTML = `<span class="seat-label">${results[0].name} さんの座席は</span><span class="single-result-text">${results[0].seat}</span><span style="font-size:14px; font-weight:normal;">です！</span>`;
        resultDiv.style.backgroundColor = "#e8f8f5";
        resultDiv.style.color = "#333";
      } else if (results.length > 1) {
        let listHtml = `<span style="color:#e74c3c; font-weight:bold;">複数のお名前が見つかりました！</span><br><span style="font-size:14px; font-weight:normal; color:#666;">該当する方をご確認ください👇</span>`;

        results.forEach(r => {

        });
        listHtml += `</div>`;
        resultDiv.innerHTML = listHtml;
        resultDiv.style.backgroundColor = "#fff3cd";
        resultDiv.style.color = "#333";
